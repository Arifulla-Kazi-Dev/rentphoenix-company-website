name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rentphoenix-company-website/package-lock.json

      - name: Install dependencies
        working-directory: rentphoenix-company-website
        run: npm ci

      - name: Build
        working-directory: rentphoenix-company-website
        run: npm run build -- --base-href /rentphoenix-company-website/

      - name: Fix Angular routing
        run: cp rentphoenix-company-website/dist/rentphoenix-company-website/browser/index.html rentphoenix-company-website/dist/rentphoenix-company-website/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./rentphoenix-company-website/dist/rentphoenix-company-website/browser
