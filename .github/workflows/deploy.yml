name: Deploy to Firebase Hosting

# Pushes to main go live on rentphoenixtech.in.
# Pull requests get a temporary preview URL, posted as a comment on the PR.
#
# One-time setup: add a GitHub secret named FIREBASE_SERVICE_ACCOUNT_RENTPHOENIXTECH_3D489
# holding a service-account JSON key for the rentphoenixtech-3d489 Firebase project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      # Live site: main branch only
      - name: Deploy to rentphoenixtech.in
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RENTPHOENIXTECH_3D489 }}
          projectId: rentphoenixtech-3d489
          channelId: live

      # Preview: a throwaway URL for each pull request, kept for 7 days
      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RENTPHOENIXTECH_3D489 }}
          projectId: rentphoenixtech-3d489
          expires: 7d
